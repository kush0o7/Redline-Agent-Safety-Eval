name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    env:
      # The suite and CLI subprocesses read UTF-8 source files and reports.
      PYTHONUTF8: "1"
      # Keep CI offline: no LiteLLM price-map download, fake provider + keyword judge (set in conftest.py).
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Run tests
        working-directory: backend
        run: pytest tests/ -q

  demo:
    # The offline demo is the first thing new users run, so keep it working.
    runs-on: ubuntu-latest
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      DEMO_NO_OPEN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "backend[dev]"
      - run: make demo

  cli-smoke:
    # What a stranger runs: build the wheel, install it alone (no [server] extra) in a fresh
    # venv, and run the CLI. Exit codes are the CI contract: 0 pass, 1 release fails, 2 error.
    runs-on: ubuntu-latest
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: python -m pip install build && python -m build --wheel backend --outdir dist
      - name: Install it in a fresh venv
        run: |
          python -m venv /tmp/stranger
          /tmp/stranger/bin/pip install dist/redline_evals-*.whl
          if /tmp/stranger/bin/python -c "import fastapi" 2>/dev/null; then echo "core install pulled in fastapi"; exit 1; fi
      - name: redline compare (a degraded model must fail the release)
        working-directory: /tmp
        run: |
          set +e
          /tmp/stranger/bin/redline compare fake-safe fake-degraded --out /tmp/out-fail > /tmp/fail.txt; code=$?
          set -e
          cat /tmp/fail.txt
          test "$code" = 1
          grep -q "ship fake-degraded. It's less safe than fake-safe" /tmp/fail.txt
          test -s /tmp/out-fail/report.html && test -s /tmp/out-fail/results.jsonl
      - name: redline compare (the same model passes) + report + scan
        working-directory: /tmp
        run: |
          /tmp/stranger/bin/redline compare fake-safe fake-safe --out /tmp/out-pass
          /tmp/stranger/bin/redline report /tmp/out-pass
          /tmp/stranger/bin/redline scan fake-safe --cases 30 --out /tmp/out-scan
          /tmp/stranger/bin/redline try --help
          /tmp/stranger/bin/redline --version
